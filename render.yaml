services:
  - type: web_service
    name: agri-ai-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: cd server && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: GROQ_API_KEY
        fromDatabase: false
      - key: ALLOWED_ORIGINS
        fromDatabase: false
      - key: FLASK_DEBUG
        fromDatabase: false
      - key: SECRET_KEY
        fromDatabase: false
